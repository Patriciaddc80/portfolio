<!doctype html>
<title>Plano de Mesas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f4f5f6;
    --ink: #21252b;
    --ink-dim: #8b93a1;
    --line: #e6e8eb;
    --dot: #d7dbe0;
    --accent: #2f6fed;
    --accent-soft: #e8f0ff;
    --accent-ink: #ffffff;
    --gold: #f0b23c;
    --danger: #e0526a;
    --diet-vegan: #4f9d63;
    --diet-vegan-bg: #e7f5ea;
    --diet-gf: #2e9a9a;
    --diet-gf-bg: #e3f5f5;
    --diet-veg: #b8862f;
    --diet-veg-bg: #faf0dc;
    --diet-other: #8b93a1;
    --diet-other-bg: #eef0f2;
    --shadow: 0 1px 2px rgba(20, 24, 33, 0.05), 0 10px 26px -14px rgba(20, 24, 33, 0.22);
  }

  /* Committed to a single light, white-background look regardless of the
     viewer's OS theme — this page intentionally does not follow dark mode. */

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
    z-index: 2;
  }
  header h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  header .tag {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 0.2rem 0.55rem;
  }
  header .spacer { flex: 1; }
  header .hint {
    font-size: 0.76rem;
    color: var(--ink-dim);
    max-width: 34rem;
    text-align: right;
    line-height: 1.4;
  }
  header .hint b { color: var(--ink); font-weight: 600; }

  /* ---------- Layout ---------- */
  .body { flex: 1; display: flex; min-height: 0; }

  .canvas-wrap {
    flex: 1;
    position: relative;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background-image: radial-gradient(circle, var(--dot) 1.4px, transparent 1.4px);
    background-size: 24px 24px;
    background-color: var(--bg);
  }
  #canvas { position: relative; width: 1040px; height: 640px; min-width: 100%; min-height: 100%; }

  /* ---------- Table ---------- */
  .table {
    position: absolute;
    left: 0;
    top: 0;
    touch-action: none;
    cursor: grab;
    user-select: none;
  }
  .table:active { cursor: grabbing; }
  .table-frame { position: relative; }
  .table-body {
    position: relative;
    background: var(--surface);
    border: 1.5px solid var(--line);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .table.selected .table-body { border-color: var(--accent); border-width: 2px; }
  .table.round .table-body { border-radius: 50%; }
  .table.rect .table-body { border-radius: 12px; }
  .table-number {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
  }
  .table.selected .table-number { color: var(--accent); }
  .table-caption {
    position: absolute;
    left: 50%;
    bottom: -22px;
    transform: translateX(-50%);
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--ink-dim);
    white-space: nowrap;
  }

  /* Guest seat = an illustrated head-and-shoulders avatar sitting at the chair spot */
  .seat {
    position: absolute;
    width: 34px;
    height: 34px;
    margin: -17px 0 0 -17px;
    border-radius: 50%;
    cursor: default;
  }
  .seat.occupied {
    cursor: pointer;
    filter: drop-shadow(0 2px 3px rgba(20, 24, 33, 0.18));
    transition: transform 0.12s ease;
  }
  .seat.occupied:hover { transform: scale(1.14); }
  .seat.occupied svg { width: 100%; height: 100%; display: block; }
  .seat.empty {
    background: var(--surface);
    border: 1.5px dashed var(--line);
  }

  .seat-label {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 50%;
    font-size: 0.63rem;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: -0.01em;
  }

  /* Ghost chair-count presets around the selected table */
  .preset {
    position: absolute;
    width: 30px;
    height: 30px;
    margin: -15px 0 0 -15px;
    border-radius: 50%;
    border: 1.5px dashed var(--line);
    color: var(--ink-dim);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 700;
    cursor: pointer;
    opacity: 0.55;
  }
  .preset:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }

  /* handles */
  .handle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    touch-action: none;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .handle svg { width: 11px; height: 11px; stroke: var(--accent-ink); }
  .rotate-handle { top: -36px; left: 50%; margin-left: -10px; }
  .scale-handle { cursor: nwse-resize; }
  .table:not(.selected) .handle,
  .table:not(.selected) .preset { display: none; }

  /* ---------- Sidebar ---------- */
  aside {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--line);
  }
  aside .head { padding: 1rem 1rem 0.6rem; border-bottom: 1px solid var(--line); }
  aside .head h2 {
    margin: 0 0 0.15rem;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-dim);
  }
  aside .head .count { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  aside .search {
    margin: 0.6rem 0.9rem;
    padding: 0.4rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    font-size: 0.82rem;
    color: var(--ink);
  }
  aside .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  #guest-list { flex: 1; overflow-y: auto; padding: 0.4rem 0.7rem 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .guest-card {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.4rem 0.55rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
    font-size: 0.83rem;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .guest-card:active { cursor: grabbing; }
  .guest-card.dragging { opacity: 0.4; }
  .guest-card .guest-avatar { width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; }
  .guest-card .guest-avatar svg { width: 100%; height: 100%; display: block; }
  .guest-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .diet-chip { font-size: 0.6rem; font-weight: 700; padding: 0.14rem 0.45rem; border-radius: 999px; white-space: nowrap; }
  .diet-vegan { color: var(--diet-vegan); background: var(--diet-vegan-bg); }
  .diet-gluten_free { color: var(--diet-gf); background: var(--diet-gf-bg); }
  .diet-vegetarian { color: var(--diet-veg); background: var(--diet-veg-bg); }
  .diet-other { color: var(--diet-other); background: var(--diet-other-bg); }

  .empty-note { text-align: center; color: var(--ink-dim); font-size: 0.8rem; padding: 2rem 1rem; }

  aside .legend {
    padding: 0.7rem 1rem 0.9rem;
    border-top: 1px solid var(--line);
    font-size: 0.7rem;
    color: var(--ink-dim);
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  aside .legend .row { display: flex; align-items: center; gap: 0.45rem; }
  aside .legend .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .dot.empty { background: var(--surface); border: 1.5px dashed var(--line); }
  .dot.occ { background: var(--gold); }

  /* toast */
  #toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--bg);
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Mobile: guest list becomes a slide-in drawer ---------- */
  .drawer-close { display: none; }
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 30;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .fab {
    display: none;
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 35;
    align-items: center;
    gap: 0.4rem;
    padding: 0.65rem 1rem;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.85rem;
    font-weight: 700;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .fab .fab-count {
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 0.05rem 0.5rem;
    font-variant-numeric: tabular-nums;
  }

  /* Drag ghost that follows the pointer for touch-friendly guest dragging */
  .drag-ghost {
    position: fixed;
    top: 0;
    left: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 60;
    filter: drop-shadow(0 4px 10px rgba(20, 24, 33, 0.35));
    transform: translate(-50%, -50%);
  }
  .drag-ghost svg { width: 100%; height: 100%; display: block; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 780px) {
    header .hint { display: none; }
    header { padding: 0.7rem 1rem; }

    aside {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(88vw, 320px);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 40;
    }
    aside.open { transform: translateX(0); }
    .drawer-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--surface-2);
      color: var(--ink-dim);
      font-size: 1rem;
      cursor: pointer;
    }
    aside .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }

    .fab { display: flex; }

    .guest-card { padding: 0.55rem 0.6rem; }
    .table-caption { font-size: 0.72rem; }
  }

  @media (max-width: 420px) {
    header h1 { font-size: 0.95rem; }
    .fab span:not(.fab-count) { display: none; }
  }
</style>

<div class="app">
  <header>
    <h1>Plano de Mesas</h1>
    <span class="tag">Demo</span>
    <div class="spacer"></div>
    <div class="hint">
      Arrastra una mesa para moverla · asa azul superior para <b>rotar</b>, esquina para <b>escalar</b> ·
      selecciona una mesa para ver los presets de nº de sillas · arrastra un invitado hasta una silla vacía.
    </div>
  </header>
  <div class="body">
    <div class="canvas-wrap">
      <div id="canvas"></div>
    </div>
    <aside id="sidebar">
      <div class="head">
        <div>
          <h2>Invitados sin mesa</h2>
          <div class="count" id="guest-count">0</div>
        </div>
        <button class="drawer-close" id="drawer-close" type="button" aria-label="Cerrar">✕</button>
      </div>
      <input class="search" id="search" type="text" placeholder="Buscar invitado…" />
      <div id="guest-list"></div>
      <div class="legend">
        <div class="row"><span class="dot empty"></span> Silla libre</div>
        <div class="row"><span class="dot occ"></span> Silla ocupada</div>
      </div>
    </aside>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<button class="fab" id="fab" type="button">
  <span>Invitados</span>
  <span class="fab-count" id="fab-count">0</span>
</button>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Geometry helpers — mirrors src/lib/seatLayout.js from the MVP source
  // ---------------------------------------------------------------
  const CHAIR_OFFSET = 30;

  function getChairPositions(table) {
    const { type, targetChairs, width, height } = table;
    const seats = [];
    if (type === "round") {
      const radius = Math.max(width, height) / 2 + CHAIR_OFFSET;
      const step = (2 * Math.PI) / targetChairs;
      for (let i = 0; i < targetChairs; i++) {
        const angle = i * step - Math.PI / 2;
        seats.push({ seatNumber: i, x: Math.cos(angle) * radius, y: Math.sin(angle) * radius });
      }
      return seats;
    }
    const perLong = Math.ceil(targetChairs / 2);
    const halfW = width / 2, halfH = height / 2;
    let n = 0;
    for (let side = 0; side < 2 && n < targetChairs; side++) {
      const y = side === 0 ? -halfH - CHAIR_OFFSET : halfH + CHAIR_OFFSET;
      const count = Math.min(perLong, targetChairs - n);
      for (let i = 0; i < count; i++) {
        const spacing = width / (count + 1);
        seats.push({ seatNumber: n, x: -halfW + spacing * (i + 1), y });
        n++;
      }
    }
    return seats;
  }

  function localToWorld(table, point) {
    const rad = (table.rotation * Math.PI) / 180;
    const s = table.scale;
    const x = point.x * s, y = point.y * s;
    return {
      x: table.x + x * Math.cos(rad) - y * Math.sin(rad),
      y: table.y + x * Math.sin(rad) + y * Math.cos(rad),
    };
  }

  function findNearestEmptySeat(tables, guests, point, maxDist) {
    let best = null, bestDist = maxDist;
    for (const table of tables) {
      for (const seat of getChairPositions(table)) {
        const occupied = guests.some((g) => g.tableId === table.id && g.seatNumber === seat.seatNumber);
        if (occupied) continue;
        const world = localToWorld(table, seat);
        const d = Math.hypot(world.x - point.x, world.y - point.y);
        if (d < bestDist) { bestDist = d; best = { tableId: table.id, seatNumber: seat.seatNumber }; }
      }
    }
    return best;
  }

  // ---------------------------------------------------------------
  // Illustrated avatar — flat head-and-shoulders icon, colors derived
  // deterministically from the guest id so they stay stable on re-render.
  // ---------------------------------------------------------------
  const SKIN = ["#f4c294", "#e3a877", "#c98a5c", "#9c6742", "#f0b483"];
  const HAIR = ["#2b241f", "#5a3826", "#171412", "#7a4a2b", "#3d3128"];
  const SHIRT = ["#2f6fed", "#e0526a", "#4f9d63", "#f0b23c", "#8a5fd6", "#4aa8c7"];

  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  function avatarSVG(seed) {
    const h = hashStr(seed);
    const shirt = SHIRT[h % SHIRT.length];
    const hair = HAIR[(h >> 3) % HAIR.length];
    const skin = SKIN[(h >> 6) % SKIN.length];
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="19" fill="${shirt}"/>
      <circle cx="20" cy="13" r="8.4" fill="${hair}"/>
      <circle cx="20" cy="16.5" r="6.6" fill="${skin}"/>
    </svg>`;
  }

  // ---------------------------------------------------------------
  // Demo data
  // ---------------------------------------------------------------
  const tables = [
    { id: "t1", type: "round", label: "Mesa 1 — Familia", targetChairs: 8, width: 130, height: 130, x: 250, y: 190, rotation: 0, scale: 1 },
    { id: "t2", type: "round", label: "Mesa 2 — Amigos", targetChairs: 8, width: 130, height: 130, x: 600, y: 170, rotation: 0, scale: 1 },
    { id: "t3", type: "rect", label: "Mesa Presidencial", targetChairs: 6, width: 220, height: 90, x: 420, y: 440, rotation: 0, scale: 1 },
    { id: "t4", type: "round", label: "Mesa 4", targetChairs: 6, width: 110, height: 110, x: 800, y: 440, rotation: 18, scale: 1 },
  ];

  const DIET_LABEL = { none: "", vegan: "Vegano", vegetarian: "Vegetariano", gluten_free: "Sin gluten", other: "Alergias" };
  const CHAIR_PRESETS = [4, 6, 8, 10];

  let guests = [
    { id: "g1", name: "Lucía Fernández", tableId: "t1", seatNumber: 0, diet: "none" },
    { id: "g2", name: "Marcos Ibáñez", tableId: "t1", seatNumber: 1, diet: "vegan" },
    { id: "g3", name: "Elena Ruiz", tableId: "t1", seatNumber: 2, diet: "none" },
    { id: "g4", name: "Diego Torres", tableId: "t3", seatNumber: 0, diet: "gluten_free" },
    { id: "g5", name: "Sofía Navarro", tableId: "t3", seatNumber: 1, diet: "none" },
    { id: "g6", name: "Pablo Serrano", tableId: null, seatNumber: null, diet: "none" },
    { id: "g7", name: "Carmen Vidal", tableId: null, seatNumber: null, diet: "vegetarian" },
    { id: "g8", name: "Álvaro Molina", tableId: null, seatNumber: null, diet: "none" },
    { id: "g9", name: "Nuria Campos", tableId: null, seatNumber: null, diet: "gluten_free" },
    { id: "g10", name: "Héctor Guzmán", tableId: null, seatNumber: null, diet: "none" },
    { id: "g11", name: "Beatriz Soler", tableId: null, seatNumber: null, diet: "other" },
    { id: "g12", name: "Iván Cabrera", tableId: null, seatNumber: null, diet: "none" },
    { id: "g13", name: "Rocío Delgado", tableId: null, seatNumber: null, diet: "vegan" },
    { id: "g14", name: "Tomás Pardo", tableId: null, seatNumber: null, diet: "none" },
  ];

  const canvas = document.getElementById("canvas");
  const guestList = document.getElementById("guest-list");
  const guestCount = document.getElementById("guest-count");
  const searchInput = document.getElementById("search");
  const toastEl = document.getElementById("toast");

  let selectedTableId = null;
  let searchQuery = "";
  let toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  function firstName(name) { return name.split(" ")[0]; }
  function lastName(name) { const parts = name.split(" "); return parts.length > 1 ? parts.slice(1).join(" ") : ""; }

  // ---------------------------------------------------------------
  // Render: tables + chairs + radial name labels
  // ---------------------------------------------------------------
  function renderTables() {
    canvas.innerHTML = "";
    for (const table of tables) {
      const el = document.createElement("div");
      el.className = "table " + (table.type === "round" ? "round" : "rect") + (table.id === selectedTableId ? " selected" : "");
      el.style.left = table.x + "px";
      el.style.top = table.y + "px";
      el.dataset.id = table.id;

      const frame = document.createElement("div");
      frame.className = "table-frame";
      frame.style.transform = `rotate(${table.rotation}deg) scale(${table.scale})`;

      const body = document.createElement("div");
      body.className = "table-body";
      body.style.width = table.width + "px";
      body.style.height = table.height + "px";

      const num = document.createElement("span");
      num.className = "table-number";
      num.textContent = table.id.replace("t", "");
      body.appendChild(num);

      const caption = document.createElement("span");
      caption.className = "table-caption";
      caption.style.transform = `translateX(-50%) rotate(${-table.rotation}deg)`;
      caption.textContent = table.label;
      body.appendChild(caption);
      frame.appendChild(body);

      // Seats + radial name labels — positioned in the table's local frame
      // (the frame's own rotate/scale carries them along automatically).
      for (const seat of getChairPositions(table)) {
        const occupant = guests.find((g) => g.tableId === table.id && g.seatNumber === seat.seatNumber);
        const cx = table.width / 2 + seat.x;
        const cy = table.height / 2 + seat.y;

        const seatEl = document.createElement("div");
        seatEl.className = "seat " + (occupant ? "occupied" : "empty");
        seatEl.style.left = cx + "px";
        seatEl.style.top = cy + "px";

        if (occupant) {
          seatEl.innerHTML = avatarSVG(occupant.id);
          seatEl.title = occupant.name + " — clic para quitar de la mesa";
          seatEl.addEventListener("click", (e) => { e.stopPropagation(); unseatGuest(occupant.id); });
          frame.appendChild(seatEl);

          // Name label runs outward along the seat's own radial spoke.
          const angleDeg = (Math.atan2(seat.y, seat.x) * 180) / Math.PI;
          const dirX = Math.cos((angleDeg * Math.PI) / 180);
          const dirY = Math.sin((angleDeg * Math.PI) / 180);
          const flip = angleDeg > 90 || angleDeg < -90;
          const labelStart = 20;
          const lx = cx + dirX * labelStart;
          const ly = cy + dirY * labelStart;

          const label = document.createElement("div");
          label.className = "seat-label";
          label.style.left = lx + "px";
          label.style.top = ly + "px";
          label.style.transform = `rotate(${flip ? angleDeg + 180 : angleDeg}deg) ${flip ? "translateX(-100%)" : ""} rotate(${-table.rotation}deg)`;
          label.style.transformOrigin = flip ? "100% 50%" : "0 50%";
          label.textContent = firstName(occupant.name) + (lastName(occupant.name) ? " " + lastName(occupant.name) : "");
          frame.appendChild(label);
        } else {
          frame.appendChild(seatEl);
        }
      }

      // Ghost chair-count presets — visible only on the selected table.
      const presetRadius = Math.max(table.width, table.height) / 2 + 78;
      CHAIR_PRESETS.filter((n) => n !== table.targetChairs).forEach((n, i) => {
        const total = CHAIR_PRESETS.length - 1;
        const angle = -Math.PI / 2 + ((i + 0.5) / total) * 1.4 * Math.PI + Math.PI * 0.55;
        const px = table.width / 2 + Math.cos(angle) * presetRadius;
        const py = table.height / 2 + Math.sin(angle) * presetRadius;
        const preset = document.createElement("button");
        preset.className = "preset";
        preset.type = "button";
        preset.style.left = px + "px";
        preset.style.top = py + "px";
        preset.style.transform = `rotate(${-table.rotation}deg)`;
        preset.textContent = n;
        preset.title = `Cambiar a ${n} sillas`;
        preset.addEventListener("click", (e) => {
          e.stopPropagation();
          table.targetChairs = n;
          toast(`${table.label}: ahora tiene ${n} sillas`);
          renderTables();
        });
        frame.appendChild(preset);
      });

      // Rotate handle
      const rot = document.createElement("div");
      rot.className = "handle rotate-handle";
      rot.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 1 2.5 5.8M4 12v5h5"/></svg>';
      body.appendChild(rot);

      const scaleHandle = document.createElement("div");
      scaleHandle.className = "handle scale-handle";
      scaleHandle.style.right = "-10px";
      scaleHandle.style.bottom = "-10px";
      scaleHandle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 18 18 6M12 18h6v-6"/></svg>';
      body.appendChild(scaleHandle);

      el.appendChild(frame);
      el.addEventListener("pointerdown", (e) => startDrag(e, table));
      el.addEventListener("click", (e) => { e.stopPropagation(); selectedTableId = table.id; renderTables(); });
      canvas.appendChild(el);

      // Handles need the *on-screen* center, not table.x/y, so rotate/scale stay
      // correct regardless of canvas scroll position (relevant once the canvas
      // becomes horizontally scrollable on small screens).
      rot.addEventListener("pointerdown", (e) => startRotate(e, table, el));
      scaleHandle.addEventListener("pointerdown", (e) => startScale(e, table, el));
    }
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.target === canvas) { selectedTableId = null; renderTables(); }
  });

  // ---------------------------------------------------------------
  // Drag / rotate / scale — pointer-event based (no external library)
  // ---------------------------------------------------------------
  function startDrag(e, table) {
    if (e.target.closest(".handle") || e.target.closest(".preset")) return;
    e.stopPropagation();
    selectedTableId = table.id;
    const startX = e.clientX, startY = e.clientY;
    const origX = table.x, origY = table.y;
    renderTables();

    function move(ev) {
      table.x = origX + (ev.clientX - startX);
      table.y = origY + (ev.clientY - startY);
      renderTables();
    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      toast(`${table.label}: posición actualizada`);
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  // Rotate/scale pivot around the table's own on-screen center. Reading it
  // from getBoundingClientRect (rather than table.x/y) keeps the math correct
  // no matter how the canvas is scrolled or offset — important on small
  // screens where the canvas pans horizontally.
  function screenCenter(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function startRotate(e, table, el) {
    e.stopPropagation();
    e.preventDefault();
    const center = screenCenter(el);
    function angleFromCenter(ev) {
      const dx = ev.clientX - center.x, dy = ev.clientY - center.y;
      return (Math.atan2(dy, dx) * 180) / Math.PI + 90;
    }
    function move(ev) {
      table.rotation = Math.round(angleFromCenter(ev));
      renderTables();
    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      toast(`${table.label}: rotación ${table.rotation}°`);
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  function startScale(e, table, el) {
    e.stopPropagation();
    e.preventDefault();
    const center = screenCenter(el);
    const startDist = Math.hypot(e.clientX - center.x, e.clientY - center.y);
    const origScale = table.scale;
    function move(ev) {
      const dist = Math.hypot(ev.clientX - center.x, ev.clientY - center.y);
      table.scale = Math.max(0.5, Math.min(2, origScale * (dist / startDist)));
      renderTables();
    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      toast(`${table.label}: escala ${table.scale.toFixed(2)}×`);
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  // ---------------------------------------------------------------
  // Guest sidebar + native HTML5 drag-and-drop onto the canvas
  // ---------------------------------------------------------------
  function renderGuests() {
    const unassigned = guests
      .filter((g) => !g.tableId)
      .filter((g) => g.name.toLowerCase().includes(searchQuery.toLowerCase()));

    guestCount.textContent = unassigned.length;
    document.getElementById("fab-count").textContent = unassigned.length;
    guestList.innerHTML = "";

    if (unassigned.length === 0) {
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = guests.some((g) => !g.tableId) ? "Sin resultados." : "Todos los invitados tienen mesa asignada.";
      guestList.appendChild(note);
      return;
    }

    for (const guest of unassigned) {
      const card = document.createElement("div");
      card.className = "guest-card";
      card.dataset.id = guest.id;
      card.addEventListener("pointerdown", (e) => startGuestDrag(e, guest, card));

      const avatar = document.createElement("div");
      avatar.className = "guest-avatar";
      avatar.innerHTML = avatarSVG(guest.id);

      const name = document.createElement("div");
      name.className = "guest-name";
      name.textContent = guest.name;

      card.appendChild(avatar);
      card.appendChild(name);

      if (guest.diet !== "none") {
        const chip = document.createElement("span");
        chip.className = "diet-chip diet-" + guest.diet;
        chip.textContent = DIET_LABEL[guest.diet];
        card.appendChild(chip);
      }

      guestList.appendChild(card);
    }
  }

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderGuests();
  });

  const canvasWrap = document.querySelector(".canvas-wrap");

  // ---------------------------------------------------------------
  // Pointer-based drag for guest cards (works on touch, unlike HTML5 DnD,
  // which has no native touch support on mobile browsers).
  // ---------------------------------------------------------------
  function startGuestDrag(e, guest, card) {
    e.preventDefault();
    card.classList.add("dragging");

    const ghost = document.createElement("div");
    ghost.className = "drag-ghost";
    ghost.innerHTML = avatarSVG(guest.id);
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
    document.body.appendChild(ghost);

    function move(ev) {
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
    }

    function up(ev) {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      ghost.remove();
      card.classList.remove("dragging");

      const wrapRect = canvasWrap.getBoundingClientRect();
      const overCanvas =
        ev.clientX >= wrapRect.left && ev.clientX <= wrapRect.right &&
        ev.clientY >= wrapRect.top && ev.clientY <= wrapRect.bottom;
      if (!overCanvas) return;

      // Map viewport coords -> #canvas content coords (accounts for scroll,
      // relevant now that the canvas pans horizontally on small screens).
      const point = {
        x: ev.clientX - wrapRect.left + canvasWrap.scrollLeft,
        y: ev.clientY - wrapRect.top + canvasWrap.scrollTop,
      };
      const target = findNearestEmptySeat(tables, guests, point, 46);
      if (target) {
        guest.tableId = target.tableId;
        guest.seatNumber = target.seatNumber;
        const table = tables.find((t) => t.id === target.tableId);
        toast(`${guest.name} sentado en ${table.label}, silla ${target.seatNumber + 1}`);
        renderTables();
        renderGuests();
        closeDrawer();
      } else {
        toast("Suelta el invitado más cerca de una silla libre");
      }
    }

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  // ---------------------------------------------------------------
  // Mobile drawer: the guest sidebar slides in over the canvas instead
  // of sharing the row, since there isn't room for both on a phone.
  // ---------------------------------------------------------------
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("backdrop");
  const fab = document.getElementById("fab");

  function openDrawer() {
    sidebar.classList.add("open");
    backdrop.classList.add("show");
  }
  function closeDrawer() {
    sidebar.classList.remove("open");
    backdrop.classList.remove("show");
  }
  fab.addEventListener("click", openDrawer);
  backdrop.addEventListener("click", closeDrawer);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);

  function unseatGuest(guestId) {
    const guest = guests.find((g) => g.id === guestId);
    if (!guest) return;
    guest.tableId = null;
    guest.seatNumber = null;
    toast(`${guest.name} quitado de la mesa`);
    renderTables();
    renderGuests();
  }

  renderTables();
  renderGuests();
})();
</script>
