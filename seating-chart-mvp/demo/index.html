<!doctype html>
<title>Plano de Mesas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f4f5f6;
    --ink: #21252b;
    --ink-dim: #8b93a1;
    --line: #e6e8eb;
    --dot: #d7dbe0;
    --accent: #2f6fed;
    --accent-soft: #e8f0ff;
    --accent-ink: #ffffff;
    --gold: #f0b23c;
    --danger: #e0526a;
    --diet-vegan: #4f9d63;
    --diet-vegan-bg: #e7f5ea;
    --diet-gf: #2e9a9a;
    --diet-gf-bg: #e3f5f5;
    --diet-veg: #b8862f;
    --diet-veg-bg: #faf0dc;
    --diet-other: #8b93a1;
    --diet-other-bg: #eef0f2;
    --shadow: 0 1px 2px rgba(20, 24, 33, 0.05), 0 10px 26px -14px rgba(20, 24, 33, 0.22);
  }

  /* Committed to a single light, white-background look regardless of the
     viewer's OS theme — this page intentionally does not follow dark mode. */

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
    z-index: 2;
  }
  header h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .brand-zone {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.4rem;
    border-radius: 8px;
    border: 1.5px dashed transparent;
    cursor: pointer;
  }
  .brand-zone:hover, .brand-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .brand-logo { max-height: 30px; max-width: 160px; display: block; }
  .brand-remove {
    display: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: var(--surface-2);
    color: var(--ink-dim);
    font-size: 0.6rem;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }
  .brand-zone:hover .brand-remove.has-logo { display: flex; }
  header .tag {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 0.2rem 0.55rem;
  }
  header .spacer { flex: 1; }

  .toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.4rem 0.7rem;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn.icon-only { padding: 0.4rem 0.55rem; }
  .lang-select { padding: 0.4rem 0.5rem; font-family: inherit; }

  .add-element-wrap { position: relative; }
  .add-element-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 45;
    min-width: 190px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 0.35rem;
    flex-direction: column;
    gap: 0.1rem;
  }
  .add-element-menu.show { display: flex; }
  .add-element-menu button {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.55rem;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    font-size: 0.8rem;
    text-align: left;
    cursor: pointer;
  }
  .add-element-menu button:hover { background: var(--surface-2); }

  header .hint {
    font-size: 0.76rem;
    color: var(--ink-dim);
    max-width: 34rem;
    text-align: right;
    line-height: 1.4;
  }
  header .hint b { color: var(--ink); font-weight: 600; }

  /* ---------- Layout ---------- */
  .body { flex: 1; display: flex; min-height: 0; }

  .canvas-wrap {
    flex: 1;
    position: relative;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background-image: radial-gradient(circle, var(--dot) 1.4px, transparent 1.4px);
    background-size: 24px 24px;
    background-color: var(--bg);
  }
  #canvas { position: relative; width: 1040px; height: 640px; min-width: 100%; min-height: 100%; }

  /* ---------- Table ---------- */
  .table {
    position: absolute;
    left: 0;
    top: 0;
    touch-action: none;
    cursor: grab;
    user-select: none;
  }
  .table:active { cursor: grabbing; }
  .table-frame { position: relative; }
  .table-body {
    position: relative;
    /* Above .seat/.preset (frame siblings, z-index:auto) so its rotate/scale/
       edit handles stay clickable even when a chair's angle happens to land
       right on top of a handle — e.g. any 8-seat round table puts a chair
       at exactly -45/-90/-135°, the same spots as the corner/top handles. */
    z-index: 2;
    background: var(--surface);
    border: 1.5px solid var(--line);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .table.selected .table-body { border-color: var(--accent); border-width: 2px; }
  .table.round .table-body { border-radius: 50%; }
  .table.rect .table-body { border-radius: 12px; }
  .table-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background-repeat: no-repeat;
  }
  .table-number {
    position: relative;
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
  }
  .table.selected .table-number { color: var(--accent); }
  .table-body.has-photo .table-number {
    color: #fff;
    padding: 0.05rem 0.5rem;
    border-radius: 999px;
    background: rgba(20, 24, 33, 0.45);
    backdrop-filter: blur(1px);
  }
  .table-caption {
    position: absolute;
    left: 50%;
    bottom: -22px;
    transform: translateX(-50%);
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--ink-dim);
    white-space: nowrap;
  }

  /* Guest seat = an illustrated head-and-shoulders avatar sitting at the chair spot */
  .seat {
    position: absolute;
    z-index: 1;
    width: 34px;
    height: 34px;
    margin: -17px 0 0 -17px;
    border-radius: 50%;
    cursor: default;
  }
  .seat.occupied {
    cursor: pointer;
    filter: drop-shadow(0 2px 3px rgba(20, 24, 33, 0.18));
    transition: transform 0.12s ease;
  }
  .seat.occupied:hover { transform: scale(1.14); }
  .seat.occupied svg,
  .seat.occupied img { width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; }
  .seat.empty {
    background: var(--surface);
    border: 1.5px dashed var(--line);
    cursor: pointer;
    transition: border-color 0.12s ease, transform 0.12s ease;
  }
  .seat.empty:hover { border-color: var(--accent); transform: scale(1.1); }
  .allergy-badge {
    position: absolute;
    right: -3px;
    bottom: -3px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--surface);
  }

  /* VIP priority indicator — elegant gold ring on the seat + a small star
     badge, opposite corner from the allergy badge so they never collide. */
  .seat.occupied.vip { box-shadow: 0 0 0 2px var(--gold), 0 2px 3px rgba(20, 24, 33, 0.18); }
  .vip-badge {
    position: absolute;
    left: -3px;
    top: -3px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
    font-size: 0.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--surface);
  }
  .guest-card.vip { border-color: var(--gold); background: linear-gradient(0deg, var(--surface-2), var(--surface-2)), #fffdf5; }

  .seat-label {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 50%;
    font-size: 0.63rem;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: -0.01em;
  }

  /* Ghost chair-count presets around the selected table */
  .preset {
    position: absolute;
    width: 30px;
    height: 30px;
    margin: -15px 0 0 -15px;
    border-radius: 50%;
    border: 1.5px dashed var(--line);
    color: var(--ink-dim);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 700;
    cursor: pointer;
    opacity: 0.55;
  }
  .preset:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }

  /* handles */
  .handle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    touch-action: none;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .handle svg { width: 11px; height: 11px; stroke: var(--accent-ink); }
  .rotate-handle { top: -36px; left: 50%; margin-left: -10px; }
  .scale-handle { cursor: nwse-resize; }
  .edit-handle { left: -10px; top: -10px; background: var(--surface); border: 1.5px solid var(--accent); }
  .edit-handle svg { stroke: var(--accent); }
  .delete-handle { background: var(--danger); }
  .delete-handle svg { stroke: #fff; }
  .table:not(.selected) .handle,
  .table:not(.selected) .preset { display: none; }

  /* ---------- Zoning elements: decor cards + wall segments ---------- */
  .elem { position: absolute; left: 0; top: 0; touch-action: none; cursor: grab; user-select: none; }
  .elem:active { cursor: grabbing; }
  .elem-frame { position: relative; }
  .elem:not(.selected) .handle { display: none; }

  .elem.decor .elem-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.2rem;
    background: var(--surface-2);
    border: 1.5px dashed var(--ink-dim);
    border-radius: 12px;
  }
  .elem.decor.selected .elem-body { border-color: var(--accent); border-style: solid; }
  .elem-emoji { font-size: 1.5rem; line-height: 1; }
  .elem-label { font-size: 0.68rem; font-weight: 600; color: var(--ink-dim); text-align: center; padding: 0 0.3rem; }

  .elem.wall .elem-body {
    background: var(--ink);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .elem.wall.selected .elem-body { background: var(--accent); }
  .wall-length {
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--bg);
    background: rgba(0, 0, 0, 0.35);
    padding: 0.05rem 0.4rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ---------- Table editor modal ---------- */
  .editor-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 70;
    padding: 1rem;
  }
  .editor-backdrop.show { display: flex; }
  .editor {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .editor-head { display: flex; align-items: center; justify-content: space-between; }
  .editor-head h3 { margin: 0; font-size: 0.95rem; font-weight: 700; }
  .editor-close {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--surface-2);
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .editor label.field-label {
    display: block;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-bottom: 0.4rem;
  }
  .editor .name-input {
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--ink);
    font-size: 0.88rem;
  }
  .editor .name-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shape-toggle { display: flex; gap: 0.5rem; }
  .shape-btn {
    flex: 1;
    padding: 0.5rem 0.3rem;
    border-radius: 9px;
    border: 1.5px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-dim);
    font-size: 0.68rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .shape-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .swatches { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(20, 24, 33, 0.08);
  }
  .swatch.active { border-color: var(--ink); }
  .swatch.none {
    background: var(--surface) !important;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--danger);
    font-size: 0.9rem;
    border: 1.5px dashed var(--line);
  }

  .photo-row { display: flex; align-items: center; gap: 0.6rem; }
  .photo-preview {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: var(--surface-2);
    background-repeat: no-repeat;
    border: 1.5px dashed var(--line);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    font-size: 0.65rem;
    text-align: center;
  }
  .photo-actions { display: flex; gap: 0.5rem; flex: 1; }
  .photo-btn {
    flex: 1;
    padding: 0.45rem 0.5rem;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
  }
  .photo-btn.remove { color: var(--danger); }

  .stepper { display: flex; align-items: center; gap: 0.9rem; }
  .stepper-btn {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1.5px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .stepper-btn:hover { border-color: var(--accent); color: var(--accent); }
  .stepper-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .stepper-value { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 1.5rem; text-align: center; }

  .image-adjust { margin-top: 0.75rem; display: none; flex-direction: column; gap: 0.55rem; }
  .image-adjust.show { display: flex; }
  .slider-row { display: flex; flex-direction: column; gap: 0.2rem; }
  .slider-row .field-label { margin-bottom: 0; }
  .slider-row input[type="range"] { width: 100%; accent-color: var(--accent); }

  .duplicate-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.55rem 0.6rem;
    border-radius: 9px;
    border: 1.5px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
  .duplicate-btn:hover { border-color: var(--accent); color: var(--accent); }
  .duplicate-btn svg { width: 15px; height: 15px; }

  /* ---------- Guest editor modal ---------- */
  .editor .note-input {
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--ink);
    font-size: 0.85rem;
    font-family: inherit;
    resize: vertical;
    min-height: 3.2rem;
  }
  .editor .note-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .editor select.select-input {
    width: 100%;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--ink);
    font-size: 0.85rem;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
  }
  .checkbox-row input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  .editor .danger-btn {
    padding: 0.55rem 0.6rem;
    border-radius: 9px;
    border: 1.5px solid var(--danger);
    background: transparent;
    color: var(--danger);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- Import Excel/CSV modal ---------- */
  .editor.import-editor { max-width: 560px; }
  .import-step { font-size: 0.78rem; color: var(--ink-dim); }
  .import-filename { font-weight: 700; color: var(--ink); }
  .mapping-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  .mapping-table { border-collapse: collapse; font-size: 0.76rem; min-width: 100%; }
  .mapping-table th, .mapping-table td {
    padding: 0.4rem 0.55rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    white-space: nowrap;
  }
  .mapping-table thead th { background: var(--surface-2); }
  .mapping-table select {
    font-size: 0.72rem;
    padding: 0.2rem 0.3rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .mapping-table td.preview-cell { color: var(--ink-dim); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .import-actions { display: flex; gap: 0.6rem; justify-content: flex-end; }
  .import-primary-btn {
    padding: 0.55rem 1rem;
    border-radius: 9px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
  .import-cancel-btn {
    padding: 0.55rem 1rem;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-dim);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .import-empty {
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.82rem;
    padding: 1rem;
  }

  /* ---------- Assign-guest picker (click an empty seat) ---------- */
  .assign-list { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.35rem; }
  .assign-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.55rem;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-2);
    cursor: pointer;
    text-align: left;
    font-size: 0.83rem;
    color: var(--ink);
  }
  .assign-row:hover { border-color: var(--accent); }
  .assign-row .guest-avatar { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; }
  .assign-row .guest-avatar svg, .assign-row .guest-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .assign-row .assign-name { flex: 1; font-weight: 500; }

  /* ---------- Sidebar ---------- */
  aside {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--line);
  }
  aside .head { padding: 1rem 1rem 0.6rem; border-bottom: 1px solid var(--line); }
  aside .head h2 {
    margin: 0 0 0.15rem;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-dim);
  }
  aside .head .count { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  aside .search {
    margin: 0.6rem 0.9rem;
    padding: 0.4rem 0.65rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    font-size: 0.82rem;
    color: var(--ink);
  }
  aside .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .import-row { padding: 0.7rem 0.9rem 0; }
  .import-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.55rem 0.6rem;
    border: 1.5px dashed var(--accent);
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .import-btn:hover { background: #dce8ff; }

  // ---------------------------------------------------------------
  // Geometry helpers — mirrors src/lib/seatLayout.js from the MVP source
  // ---------------------------------------------------------------
  const CHAIR_OFFSET = 30;

  function getChairPositions(table) {
    const { type, targetChairs, width, height } = table;
    const seats = [];
    if (type === "round") {
      const radius = Math.max(width, height) / 2 + CHAIR_OFFSET;
      const step = (2 * Math.PI) / targetChairs;
      for (let i = 0; i < targetChairs; i++) {
        const angle = i * step - Math.PI / 2;
        seats.push({ seatNumber: i, x: Math.cos(angle) * radius, y: Math.sin(angle) * radius });
      }
      return seats;
    }
    const perLong = Math.ceil(targetChairs / 2);
    const halfW = width / 2, halfH = height / 2;
    let n = 0;
    for (let side = 0; side < 2 && n < targetChairs; side++) {
      const y = side === 0 ? -halfH - CHAIR_OFFSET : halfH + CHAIR_OFFSET;
      const count = Math.min(perLong, targetChairs - n);
      for (let i = 0; i < count; i++) {
        const spacing = width / (count + 1);
        seats.push({ seatNumber: n, x: -halfW + spacing * (i + 1), y });
        n++;
      }
    }
    return seats;
  }

  function localToWorld(table, point) {
    const rad = (table.rotation * Math.PI) / 180;
    const s = table.scale;
    const x = point.x * s, y = point.y * s;
    // table.x/y is the table box's top-left corner (how it's actually
    // positioned in the DOM); rotation/scale pivot around its center,
    // which is the fixed CSS transform-origin regardless of scale.
    const centerX = table.x + table.width / 2;
    const centerY = table.y + table.height / 2;
    return {
      x: centerX + x * Math.cos(rad) - y * Math.sin(rad),
      y: centerY + x * Math.sin(rad) + y * Math.cos(rad),
    };
  }

  function findNearestEmptySeat(tables, guests, point, maxDist) {
    let best = null, bestDist = maxDist;
    for (const table of tables) {
      for (const seat of getChairPositions(table)) {
        const occupied = guests.some((g) => g.tableId === table.id && g.seatNumber === seat.seatNumber);
        if (occupied) continue;
        const world = localToWorld(table, seat);
        const d = Math.hypot(world.x - point.x, world.y - point.y);
        if (d < bestDist) { bestDist = d; best = { tableId: table.id, seatNumber: seat.seatNumber }; }
      }
    }
    return best;
  }

  // ---------------------------------------------------------------
  // Illustrated avatar — flat head-and-shoulders icon, colors derived
  // deterministically from the guest id so they stay stable on re-render.
  // ---------------------------------------------------------------
  const SKIN = ["#f4c294", "#e3a877", "#c98a5c", "#9c6742", "#f0b483"];
  const HAIR = ["#2b241f", "#5a3826", "#171412", "#7a4a2b", "#3d3128"];
  const SHIRT = ["#2f6fed", "#e0526a", "#4f9d63", "#f0b23c", "#8a5fd6", "#4aa8c7"];

  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  // Downscale + re-encode an uploaded image client-side before it goes into
  // state — keeps guest photos and the org logo small (a few KB instead of
  // multi-MB phone photos) since everything ends up base64-inlined.
  function compressImageFile(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No se pudo cargar la imagen")); };
      img.src = url;
    });
  }

  // A guest with a `photo` (base64 data URI or URL) gets a real cropped
  // photo instead of the generated icon — same circular slot either way.
  function avatarMarkup(guest) {
    if (guest.photo) {
      return `<img src="${guest.photo}" alt="${guest.name}" draggable="false">`;
    }
    return avatarSVG(guest.id);
  }

  function avatarSVG(seed) {
    const h = hashStr(seed);
    const shirt = SHIRT[h % SHIRT.length];
    const hair = HAIR[(h >> 3) % HAIR.length];
    const skin = SKIN[(h >> 6) % SKIN.length];
    return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="19" fill="${shirt}"/>
      <circle cx="20" cy="13" r="8.4" fill="${hair}"/>
      <circle cx="20" cy="16.5" r="6.6" fill="${skin}"/>
    </svg>`;
  }

  function rsvpLabel(key) { return t("rsvp." + key).replace(/^[^\s]+\s/, ""); } // drop the emoji for inline use

  const canvas = document.getElementById("canvas");
  const guestList = document.getElementById("guest-list");
  const guestCount = document.getElementById("guest-count");
  const searchInput = document.getElementById("search");
  const toastEl = document.getElementById("toast");

  let selectedTableId = null;
  let selectedElementId = null;
  let searchQuery = "";
  let toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  function firstName(name) { return name.split(" ")[0]; }
  function lastName(name) { const parts = name.split(" "); return parts.length > 1 ? parts.slice(1).join(" ") : ""; }

  // ---------------------------------------------------------------
  // Render: tables + chairs + radial name labels
  // ---------------------------------------------------------------
  function renderTables() {
    canvas.innerHTML = "";
    for (const table of tables) {
      const el = document.createElement("div");
      el.className = "table " + (table.type === "round" ? "round" : "rect") + (table.id === selectedTableId ? " selected" : "");
      el.style.left = table.x + "px";
      el.style.top = table.y + "px";
      el.dataset.id = table.id;

      const frame = document.createElement("div");
      frame.className = "table-frame";
      frame.style.transform = `rotate(${table.rotation}deg) scale(${table.scale})`;

      const body = document.createElement("div");
      body.className = "table-body" + (table.image ? " has-photo" : "");
      body.style.width = table.width + "px";
      body.style.height = table.height + "px";
      if (table.image) {
        const photo = document.createElement("div");
        photo.className = "table-photo";
        photo.style.backgroundImage = `url(${table.image})`;
        photo.style.backgroundSize = `${table.imageZoom || 100}%`;
        photo.style.backgroundPosition = `${table.imageOffsetX ?? 50}% ${table.imageOffsetY ?? 50}%`;
        body.appendChild(photo);
      } else if (table.color) {
        body.style.background = table.color;
      }

      const num = document.createElement("span");
      num.className = "table-number";
      num.textContent = table.id.replace("t", "");
      body.appendChild(num);

      const caption = document.createElement("span");
      caption.className = "table-caption";
      caption.style.transform = `translateX(-50%) rotate(${-table.rotation}deg)`;
      caption.textContent = table.label;
      body.appendChild(caption);
      frame.appendChild(body);

      // Seats + radial name labels — positioned in the table's local frame
      // (the frame's own rotate/scale carries them along automatically).
      for (const seat of getChairPositions(table)) {
        const occupant = guests.find((g) => g.tableId === table.id && g.seatNumber === seat.seatNumber);
        const cx = table.width / 2 + seat.x;
        const cy = table.height / 2 + seat.y;

        const seatEl = document.createElement("div");
        seatEl.className = "seat " + (occupant ? "occupied" : "empty") + (occupant && occupant.vip ? " vip" : "");
        seatEl.style.left = cx + "px";
        seatEl.style.top = cy + "px";

        if (occupant) {
          seatEl.innerHTML = avatarMarkup(occupant);
          seatEl.title = occupant.name + (occupant.vip ? " (VIP)" : "") + t("seat.editHint");
          seatEl.addEventListener("click", (e) => { e.stopPropagation(); openGuestEditor(occupant); });
          if (occupant.vip) {
            const star = document.createElement("span");
            star.className = "vip-badge";
            star.textContent = "★";
            star.title = "Invitado VIP";
            seatEl.appendChild(star);
          }
          if (occupant.allergySevere) {
            const badge = document.createElement("span");
            badge.className = "allergy-badge";
            badge.textContent = "⚠";
            badge.title = "Alergia grave";
            seatEl.appendChild(badge);
          }
          frame.appendChild(seatEl);

          // Name label runs outward along the seat's own radial spoke.
          const angleDeg = (Math.atan2(seat.y, seat.x) * 180) / Math.PI;
          const dirX = Math.cos((angleDeg * Math.PI) / 180);
          const dirY = Math.sin((angleDeg * Math.PI) / 180);
          const flip = angleDeg > 90 || angleDeg < -90;
          const labelStart = 19; // ~2px past the 17px avatar radius: touching, not floating
          const lx = cx + dirX * labelStart;
          const ly = cy + dirY * labelStart;

          const label = document.createElement("div");
          label.className = "seat-label";
          label.style.left = lx + "px";
          label.style.top = ly + "px";
          label.style.transform = `rotate(${flip ? angleDeg + 180 : angleDeg}deg) ${flip ? "translateX(-100%)" : ""} rotate(${-table.rotation}deg)`;
          label.style.transformOrigin = flip ? "100% 50%" : "0 50%";
          // Keep the label short (first name + last initial) so it stays
          // right against its avatar instead of stretching far away on
          // small tables — the full name is still on the seat's tooltip,
          // the sidebar card, and the guest editor.
          const last = lastName(occupant.name);
          label.textContent = firstName(occupant.name) + (last ? " " + last[0] + "." : "");
          frame.appendChild(label);
        } else {
          seatEl.title = t("seat.assignHint");
          seatEl.addEventListener("click", (e) => { e.stopPropagation(); openAssignPicker(table.id, seat.seatNumber); });
          frame.appendChild(seatEl);
        }
      }

      // Ghost chair-count presets — visible only on the selected table.
      const presetRadius = Math.max(table.width, table.height) / 2 + 78;
      CHAIR_PRESETS.filter((n) => n !== table.targetChairs).forEach((n, i) => {
        const total = CHAIR_PRESETS.length - 1;
        const angle = -Math.PI / 2 + ((i + 0.5) / total) * 1.4 * Math.PI + Math.PI * 0.55;
        const px = table.width / 2 + Math.cos(angle) * presetRadius;
        const py = table.height / 2 + Math.sin(angle) * presetRadius;
        const preset = document.createElement("button");
        preset.className = "preset";
        preset.type = "button";
        preset.style.left = px + "px";
        preset.style.top = py + "px";
        preset.style.transform = `rotate(${-table.rotation}deg)`;
        preset.textContent = n;
        preset.title = t("preset.changeTo", n);
        preset.addEventListener("click", (e) => {
          e.stopPropagation();
          table.targetChairs = n;
          toast(t("toast.chairsChanged", table.label, n));
          renderTables();
        });
        frame.appendChild(preset);
      });

      // Rotate handle
      const rot = document.createElement("div");
      rot.className = "handle rotate-handle";
      rot.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 1 2.5 5.8M4 12v5h5"/></svg>';
      body.appendChild(rot);

      const scaleHandle = document.createElement("div");
      scaleHandle.className = "handle scale-handle";
      scaleHandle.style.right = "-10px";
      scaleHandle.style.bottom = "-10px";
      scaleHandle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 18 18 6M12 18h6v-6"/></svg>';
      body.appendChild(scaleHandle);

      // Edit handle — opens the modal to rename, recolor, reshape or add a photo.
      const editHandle = document.createElement("div");
      editHandle.className = "handle edit-handle";
      editHandle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.83l-1.17-1.17a2 2 0 0 0-2.83 0L4 15.5V20z"/></svg>';
      editHandle.title = t("tableEditor.editTitle");
      editHandle.addEventListener("pointerdown", (e) => e.stopPropagation());
      editHandle.addEventListener("click", (e) => { e.stopPropagation(); openTableEditor(table); });
      body.appendChild(editHandle);

      el.appendChild(frame);
      el.addEventListener("pointerdown", (e) => startDrag(e, table));
      el.addEventListener("click", (e) => { e.stopPropagation(); selectedTableId = table.id; selectedElementId = null; renderTables(); });
      canvas.appendChild(el);

      // Handles need the *on-screen* center, not table.x/y, so rotate/scale stay
      // correct regardless of canvas scroll position (relevant once the canvas
      // becomes horizontally scrollable on small screens).
      rot.addEventListener("pointerdown", (e) => startRotate(e, table, el));
      scaleHandle.addEventListener("pointerdown", (e) => startScale(e, table, el));
    }

    for (const item of elements) renderElement(item);
  }

  // Decor cards and wall segments — simpler siblings of tables (drag,
  // rotate, scale, delete; no seats/editor modal).
  function renderElement(item) {
    const el = document.createElement("div");
    el.className = "elem " + item.kind + (item.id === selectedElementId ? " selected" : "");
    el.style.left = item.x + "px";
    el.style.top = item.y + "px";
    el.dataset.id = item.id;

    const frame = document.createElement("div");
    frame.className = "elem-frame";
    frame.style.transform = `rotate(${item.rotation}deg) scale(${item.scale})`;

    const body = document.createElement("div");
    body.className = "elem-body";
    body.style.width = item.width + "px";
    body.style.height = item.height + "px";

    if (item.kind === "wall") {
      const lengthLabel = document.createElement("span");
      lengthLabel.className = "wall-length";
      lengthLabel.textContent = Math.round(item.width * item.scale) + '"';
      body.appendChild(lengthLabel);
    } else {
      const emoji = document.createElement("span");
      emoji.className = "elem-emoji";
      emoji.textContent = item.emoji;
      const label = document.createElement("span");
      label.className = "elem-label";
      label.textContent = item.label;
      body.appendChild(emoji);
      body.appendChild(label);
    }
    frame.appendChild(body);

    const rot = document.createElement("div");
    rot.className = "handle rotate-handle";
    rot.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 1 2.5 5.8M4 12v5h5"/></svg>';
    body.appendChild(rot);

    const scaleHandle = document.createElement("div");
    scaleHandle.className = "handle scale-handle";
    scaleHandle.style.right = "-10px";
    scaleHandle.style.bottom = "-10px";
    scaleHandle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 18 18 6M12 18h6v-6"/></svg>';
    body.appendChild(scaleHandle);

    const delHandle = document.createElement("div");
    delHandle.className = "handle delete-handle";
    delHandle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12"/></svg>';
    delHandle.title = t("common.delete");
    delHandle.style.left = "-10px";
    delHandle.style.top = "-10px";
    delHandle.addEventListener("pointerdown", (e) => e.stopPropagation());
    delHandle.addEventListener("click", (e) => {
      e.stopPropagation();
      elements = elements.filter((it) => it.id !== item.id);
      selectedElementId = null;
      renderTables();
    });
    body.appendChild(delHandle);

    el.appendChild(frame);
    el.addEventListener("pointerdown", (e) => startDrag(e, item));
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      selectedElementId = item.id;
      selectedTableId = null;
      renderTables();
    });
    canvas.appendChild(el);

    rot.addEventListener("pointerdown", (e) => startRotate(e, item, el));
    scaleHandle.addEventListener("pointerdown", (e) => startScale(e, item, el));
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.target === canvas) { selectedTableId = null; selectedElementId = null; renderTables(); }
  });

  // ---------------------------------------------------------------
  // Drag / rotate / scale — pointer-event based (no external library)
  // ---------------------------------------------------------------
  // Shared by tables AND zoning elements (decor/walls) — both are plain
  // {x, y, rotation, scale, label} objects, so the same drag/rotate/scale
  // gestures work for either; only the selection bookkeeping differs.
  function startDrag(e, table) {
    // Seats need their own click (open the guest editor / unseat) to reach
    // the target intact; if startDrag ran first it would re-render the
    // canvas mid-gesture and orphan the seat element before "click" fires.
    if (e.target.closest(".handle") || e.target.closest(".preset") || e.target.closest(".seat")) return;
    e.stopPropagation();
    if (table.kind) { selectedElementId = table.id; selectedTableId = null; }
    else { selectedTableId = table.id; selectedElementId = null; }
    const startX = e.clientX, startY = e.clientY;
    const origX = table.x, origY = table.y;
    renderTables();

    function move(ev) {
      table.x = origX + (ev.clientX - startX);
      table.y = origY + (ev.clientY - startY);
      renderTables();
    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      toast(t("toast.tableMoved", table.label));
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  // Rotate/scale pivot around the table's own on-screen center. Reading it
  // from getBoundingClientRect (rather than table.x/y) keeps the math correct
  // no matter how the canvas is scrolled or offset — important on small
  // screens where the canvas pans horizontally.
  function screenCenter(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function startRotate(e, table, el) {
    e.stopPropagation();
    e.preventDefault();
    const center = screenCenter(el);
    function angleFromCenter(ev) {
      const dx = ev.clientX - center.x, dy = ev.clientY - center.y;
      return (Math.atan2(dy, dx) * 180) / Math.PI + 90;
    }
    function move(ev) {
      table.rotation = Math.round(angleFromCenter(ev));
      renderTables();
    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      toast(t("toast.tableRotated", table.label, table.rotation));
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  function startScale(e, table, el) {
    e.stopPropagation();
    e.preventDefault();
    const center = screenCenter(el);
    const startDist = Math.hypot(e.clientX - center.x, e.clientY - center.y);
    const origScale = table.scale;
    function move(ev) {
      const dist = Math.hypot(ev.clientX - center.x, ev.clientY - center.y);
      table.scale = Math.max(0.5, Math.min(2, origScale * (dist / startDist)));
      renderTables();
    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      toast(t("toast.tableScaled", table.label, table.scale.toFixed(2)));
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  // ---------------------------------------------------------------
  // "+ Elemento" menu: zoning (dance floor, stage, DJ booth, altar, gift
  // table, cake) and walls drawn to a real inch length.
  // ---------------------------------------------------------------
  const addElementBtn = document.getElementById("add-element-btn");
  const addElementMenu = document.getElementById("add-element-menu");

  addElementBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    addElementMenu.classList.toggle("show");
  });
  document.addEventListener("click", () => addElementMenu.classList.remove("show"));
  addElementMenu.addEventListener("click", (e) => e.stopPropagation());

  addElementMenu.querySelectorAll("button[data-decor]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const def = DECOR_TYPES[btn.dataset.decor];
      const item = {
        id: "e" + elementIdCounter++,
        kind: "decor",
        decorType: btn.dataset.decor,
        emoji: def.emoji,
        label: t("elements." + btn.dataset.decor).replace(/^[^\s]+\s/, ""),
        width: def.width,
        height: def.height,
        x: 460 - def.width / 2,
        y: 260 - def.height / 2,
        rotation: 0,
        scale: 1,
      };
      elements.push(item);
      selectedElementId = item.id;
      selectedTableId = null;
      addElementMenu.classList.remove("show");
      toast(t("toast.elementAdded", item.label));
      renderTables();
    });
  });

  addElementMenu.querySelector("button[data-wall]").addEventListener("click", () => {
    const item = {
      id: "e" + elementIdCounter++,
      kind: "wall",
      label: t("elements.wallLabel"),
      width: 220,
      height: 14,
      x: 380,
      y: 150,
      rotation: 0,
      scale: 1,
    };
    elements.push(item);
    selectedElementId = item.id;
    selectedTableId = null;
    addElementMenu.classList.remove("show");
    toast(t("toast.wallAdded"));
    renderTables();
  });

  // ---------------------------------------------------------------
  // Guest sidebar + native HTML5 drag-and-drop onto the canvas
  // ---------------------------------------------------------------
  function renderGuests() {
    const unassigned = guests
      .filter((g) => !g.tableId)
      .filter((g) => g.name.toLowerCase().includes(searchQuery.toLowerCase()));

    guestCount.textContent = unassigned.length;
    document.getElementById("fab-count").textContent = unassigned.length;
    guestList.innerHTML = "";

    if (unassigned.length === 0) {
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = guests.some((g) => !g.tableId) ? t("list.noResults") : t("list.noneUnassigned");
      guestList.appendChild(note);
      return;
    }

    for (const guest of unassigned) {
      const notConfirmed = guest.rsvp && guest.rsvp !== "confirmed";
      const card = document.createElement("div");
      card.className = "guest-card" + (notConfirmed ? " not-confirmed" : "") + (guest.vip ? " vip" : "");
      card.dataset.id = guest.id;
      card.addEventListener("pointerdown", (e) => startGuestDrag(e, guest, card));

      const avatar = document.createElement("div");
      avatar.className = "guest-avatar";
      avatar.innerHTML = avatarMarkup(guest);
      if (guest.vip) {
        const star = document.createElement("span");
        star.className = "vip-badge";
        star.textContent = "★";
        star.title = "Invitado VIP";
        avatar.appendChild(star);
      }
      if (guest.allergySevere) {
        const badge = document.createElement("span");
        badge.className = "allergy-badge";
        badge.textContent = "⚠";
        badge.title = "Alergia grave";
        avatar.appendChild(badge);
      }
      card.appendChild(avatar);

      const nameWrap = document.createElement("div");
      nameWrap.className = "guest-name-wrap";
      const name = document.createElement("div");
      name.className = "guest-name";
      name.textContent = guest.name;
      nameWrap.appendChild(name);
      if (guest.note) {
        const note = document.createElement("div");
        note.className = "guest-note";
        note.textContent = guest.note;
        note.title = guest.note;
        nameWrap.appendChild(note);
      }
      card.appendChild(nameWrap);

      if (guest.diet !== "none" || guest.child || notConfirmed) {
        const chips = document.createElement("div");
        chips.className = "guest-chips";
        if (notConfirmed) {
          const chip = document.createElement("span");
          chip.className = "rsvp-chip rsvp-" + guest.rsvp;
          chip.textContent = t(guest.rsvp === "pending" ? "rsvp.pending" : "rsvp.declined");
          chips.appendChild(chip);
        }
        if (guest.diet !== "none") {
          const chip = document.createElement("span");
          chip.className = "diet-chip diet-" + guest.diet;
          chip.textContent = dietLabel(guest.diet);
          chips.appendChild(chip);
        }
        if (guest.child) {
          const chip = document.createElement("span");
          chip.className = "child-chip";
          chip.textContent = t("guestEditor.child");
          chips.appendChild(chip);
        }
        card.appendChild(chips);
      }

      const editBtn = document.createElement("button");
      editBtn.className = "guest-edit-btn";
      editBtn.type = "button";
      editBtn.title = t("guestEditor.editTitle");
      editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.83l-1.17-1.17a2 2 0 0 0-2.83 0L4 15.5V20z"/></svg>';
      editBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
      editBtn.addEventListener("click", (e) => { e.stopPropagation(); openGuestEditor(guest); });
      card.appendChild(editBtn);

      guestList.appendChild(card);
    }
  }

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderGuests();
  });

  const canvasWrap = document.querySelector(".canvas-wrap");

  // ---------------------------------------------------------------
  // Pointer-based drag for guest cards (works on touch, unlike HTML5 DnD,
  // which has no native touch support on mobile browsers).
  // ---------------------------------------------------------------
  // Single choke point for "put this guest in this seat" — used by drag&drop,
  // the click-to-assign popover, and the Excel/CSV importer, so the RSVP
  // rule (only confirmed guests get seated) only has to live in one place.
  function seatGuest(guest, tableId, seatNumber) {
    if (guest.rsvp && guest.rsvp !== "confirmed") {
      toast(t("toast.rsvpBlocked", guest.name, rsvpLabel(guest.rsvp)));
      return false;
    }
    guest.tableId = tableId;
    guest.seatNumber = seatNumber;
    const table = tables.find((t) => t.id === tableId);
    toast(t("toast.guestSeated", guest.name, table.label, seatNumber + 1));
    renderTables();
    renderGuests();
    return true;
  }

  function startGuestDrag(e, guest, card) {
    if (guest.rsvp && guest.rsvp !== "confirmed") {
      toast(t("toast.rsvpBlocked", guest.name, rsvpLabel(guest.rsvp)));
      return;
    }
    e.preventDefault();
    card.classList.add("dragging");

    const ghost = document.createElement("div");
    ghost.className = "drag-ghost";
    ghost.innerHTML = avatarMarkup(guest);
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
    document.body.appendChild(ghost);

    function move(ev) {
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
    }

    function up(ev) {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      ghost.remove();
      card.classList.remove("dragging");

      const wrapRect = canvasWrap.getBoundingClientRect();
      const overCanvas =
        ev.clientX >= wrapRect.left && ev.clientX <= wrapRect.right &&
        ev.clientY >= wrapRect.top && ev.clientY <= wrapRect.bottom;
      if (!overCanvas) return;

      // Map viewport coords -> #canvas content coords (accounts for scroll,
      // relevant now that the canvas pans horizontally on small screens).
      const point = {
        x: ev.clientX - wrapRect.left + canvasWrap.scrollLeft,
        y: ev.clientY - wrapRect.top + canvasWrap.scrollTop,
      };
      const target = findNearestEmptySeat(tables, guests, point, 46);
      if (target && seatGuest(guest, target.tableId, target.seatNumber)) {
        closeDrawer();
      } else if (!target) {
        toast(t("toast.dropNearSeat"));
      }
    }

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  }

  // ---------------------------------------------------------------
  // Mobile drawer: the guest sidebar slides in over the canvas instead
  // of sharing the row, since there isn't room for both on a phone.
  // ---------------------------------------------------------------
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("backdrop");
  const fab = document.getElementById("fab");

  function openDrawer() {
    sidebar.classList.add("open");
    backdrop.classList.add("show");
  }
  function closeDrawer() {
    sidebar.classList.remove("open");
    backdrop.classList.remove("show");
  }
  fab.addEventListener("click", openDrawer);
  backdrop.addEventListener("click", closeDrawer);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);

  function unseatGuest(guestId) {
    const guest = guests.find((g) => g.id === guestId);
    if (!guest) return;
    guest.tableId = null;
    guest.seatNumber = null;
    toast(t("toast.guestUnseated", guest.name));
    renderTables();
    renderGuests();
  }

  // ---------------------------------------------------------------
  // Guest editor: rename, set dietary restriction, mark as a child,
  // add a note, or unseat — reachable from the sidebar pencil icon or

  // ---------------------------------------------------------------
  // Table editor: rename, recolor, reshape, or set a background photo.
  // Every field applies immediately and re-renders the canvas.
  // ---------------------------------------------------------------
  const TABLE_COLORS = [
    "#ffffff", "#fdece9", "#fff2d8", "#eaf6e9",
    "#e3f2f2", "#e8eefd", "#f1e9fb", "#fbe6f0",

  const editorBackdrop = document.getElementById("editor-backdrop");
  const editorName = document.getElementById("editor-name");

  const photoPreview = document.getElementById("editor-photo-preview");
  const photoInput = document.getElementById("editor-photo-input");
  const chairsValue = document.getElementById("chairs-value");

  const MIN_CHAIRS = 2;

  // Round / rectangular / imperial (long banquet table) defaults, kept sane
  // so switching shape doesn't leave a round table absurdly wide. Imperial
  // shares the "rect" table.type (same border-radius, same two-long-sides
  // chair layout) — only its default size and the editor's active-button
  // highlight (via table.shapeVariant) differ from a regular rectangle.
  const SHAPE_DEFAULTS = {
    round: { width: 130, height: 130 },
    rect: { width: 200, height: 90 },
    imperial: { width: 340, height: 90 },
  };
  const SHAPE_TYPE = { round: "round", rect: "rect", imperial: "rect" };

  function buildSwatches() {
    swatchesEl.innerHTML = "";

    none.title = "Sin color";
    none.addEventListener("click", () => {
      editingTable.color = null;

      syncEditor();

      sw.type = "button";
      sw.className = "swatch";
      sw.style.background = color;
      sw.dataset.color = color;
      sw.title = color;

        editingTable.image = null;

        syncEditor();
      });

  buildSwatches();

  function syncEditor() {
    if (!editingTable) return;
    editorName.value = editingTable.label;

    const variant = editingTable.shapeVariant || editingTable.type;
    document.getElementById("shape-round").classList.toggle("active", variant === "round");
    document.getElementById("shape-rect").classList.toggle("active", variant === "rect");

    swatchesEl.querySelectorAll(".swatch").forEach((sw) => {
      const isNone = sw.classList.contains("none");

      sw.classList.toggle("active", !editingTable.image && matches);

    chairsValue.textContent = editingTable.targetChairs;
    chairsMinus.disabled = editingTable.targetChairs <= MIN_CHAIRS;
    chairsPlus.disabled = editingTable.targetChairs >= MAX_CHAIRS;

    if (editingTable.image) {
      photoPreview.innerHTML = "";
      photoPreview.style.backgroundImage = `url(${editingTable.image})`;
      photoPreview.style.backgroundSize = `${editingTable.imageZoom || 100}%`;
      photoPreview.style.backgroundPosition = `${editingTable.imageOffsetX ?? 50}% ${editingTable.imageOffsetY ?? 50}%`;
      imageAdjust.classList.add("show");
      imageZoomSlider.value = editingTable.imageZoom || 100;
      imageXSlider.value = editingTable.imageOffsetX ?? 50;
      imageYSlider.value = editingTable.imageOffsetY ?? 50;
    } else {
      photoPreview.textContent = "Sin foto";
      photoPreview.style.backgroundImage = "";
      imageAdjust.classList.remove("show");
    }
  }

  function openTableEditor(table) {

  // -- Duplicate the table being edited ---------------------------------
  function nextTableId() {
    const maxN = tables.reduce((max, t) => {
      const n = parseInt(t.id.replace(/^t/, ""), 10);

  // ---------------------------------------------------------------
  // Import guests from Excel (.xlsx) or CSV. There is no bundled parser
  // library — CSV is parsed by hand, and .xlsx (a ZIP of XML files) is
  // unzipped and inflated using the browser's native DecompressionStream,
  // so the whole page stays a single self-contained file.
  // ---------------------------------------------------------------
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function parseCSV(text) {
    const firstLine = text.slice(0, text.indexOf("\n") === -1 ? text.length : text.indexOf("\n"));
    const delim = firstLine.split(";").length > firstLine.split(",").length ? ";" : ",";
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === delim) {
        row.push(field); field = "";
      } else if (c === "\n") {
        row.push(field); rows.push(row); row = []; field = "";
      } else if (c !== "\r") {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ""));
  }

  // -- Minimal ZIP reader + XLSX (OOXML) worksheet extraction --------
  function readUInt16LE(bytes, o) { return bytes[o] | (bytes[o + 1] << 8); }
  function readUInt32LE(bytes, o) {
    return (bytes[o] | (bytes[o + 1] << 8) | (bytes[o + 2] << 16) | (bytes[o + 3] << 24)) >>> 0;
  }

  function readZipEntries(bytes) {
    const EOCD_SIG = 0x06054b50;
    let eocdOffset = -1;
    for (let i = bytes.length - 22; i >= 0; i--) {
      if (readUInt32LE(bytes, i) === EOCD_SIG) { eocdOffset = i; break; }
    }
    if (eocdOffset === -1) throw new Error("No es un .xlsx/.zip válido");
    const totalEntries = readUInt16LE(bytes, eocdOffset + 10);
    let offset = readUInt32LE(bytes, eocdOffset + 16);
    const CD_SIG = 0x02014b50;
    const entries = {};
    for (let i = 0; i < totalEntries; i++) {
      if (readUInt32LE(bytes, offset) !== CD_SIG) break;
      const method = readUInt16LE(bytes, offset + 10);
      const compressedSize = readUInt32LE(bytes, offset + 20);
      const fileNameLength = readUInt16LE(bytes, offset + 28);
      const extraLength = readUInt16LE(bytes, offset + 30);
      const commentLength = readUInt16LE(bytes, offset + 32);
      const localHeaderOffset = readUInt32LE(bytes, offset + 42);
      const fileName = new TextDecoder().decode(bytes.subarray(offset + 46, offset + 46 + fileNameLength));
      entries[fileName] = { method, compressedSize, localHeaderOffset };
      offset += 46 + fileNameLength + extraLength + commentLength;
    }
    return entries;
  }

  async function inflateEntry(bytes, entry) {
    const o = entry.localHeaderOffset;
    if (readUInt32LE(bytes, o) !== 0x04034b50) throw new Error("Cabecera local ZIP inválida");
    const nameLen = readUInt16LE(bytes, o + 26);
    const extraLen = readUInt16LE(bytes, o + 28);
    const dataStart = o + 30 + nameLen + extraLen;
    const compressed = bytes.subarray(dataStart, dataStart + entry.compressedSize);
    let outBytes;
    if (entry.method === 0) {
      outBytes = compressed;
    } else if (entry.method === 8) {
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      outBytes = new Uint8Array(await new Response(stream).arrayBuffer());
    } else {
      throw new Error("Compresión ZIP no soportada: " + entry.method);
    }
    return new TextDecoder("utf-8").decode(outBytes);
  }

  function parseSharedStrings(xmlText) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    return Array.from(doc.getElementsByTagName("si")).map((si) =>
      Array.from(si.getElementsByTagName("t")).map((t) => t.textContent).join("")
    );
  }

  function colLetterToIndex(ref) {
    const m = ref.match(/^([A-Z]+)/);
    if (!m) return 0;
    let col = 0;
    for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64);
    return col - 1;
  }

  function sheetToRows(xmlText, sharedStrings) {
    const doc = new DOMParser().parseFromString(xmlText, "application/xml");
    const rows = [];
    for (const rowEl of Array.from(doc.getElementsByTagName("row"))) {
      const rowArr = [];
      for (const c of Array.from(rowEl.getElementsByTagName("c"))) {
        const idx = colLetterToIndex(c.getAttribute("r") || "");
        const type = c.getAttribute("t");
        let value = "";
        if (type === "inlineStr") {
          const isEl = c.getElementsByTagName("is")[0];
          value = isEl ? Array.from(isEl.getElementsByTagName("t")).map((t) => t.textContent).join("") : "";
        } else {
          const vEl = c.getElementsByTagName("v")[0];
          const raw = vEl ? vEl.textContent : "";
          value = type === "s" ? sharedStrings[parseInt(raw, 10)] || "" : raw;
        }
        rowArr[idx] = value;
      }
      for (let i = 0; i < rowArr.length; i++) if (rowArr[i] === undefined) rowArr[i] = "";
      rows.push(rowArr);
    }
    return rows;
  }

  async function readXlsx(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    const entries = readZipEntries(bytes);
    const sharedStrings = entries["xl/sharedStrings.xml"]
      ? parseSharedStrings(await inflateEntry(bytes, entries["xl/sharedStrings.xml"]))
      : [];
    const sheetNames = Object.keys(entries)
      .filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
      .sort((a, b) => parseInt(a.match(/sheet(\d+)/)[1], 10) - parseInt(b.match(/sheet(\d+)/)[1], 10));
    if (!sheetNames.length) throw new Error("No se encontró ninguna hoja");
    const sheetXml = await inflateEntry(bytes, entries[sheetNames[0]]);
    return sheetToRows(sheetXml, sharedStrings);
  }

  // -- Column-mapping UI + commit -------------------------------------
  const importBtn = document.getElementById("import-btn");
  const importFileInput = document.getElementById("import-file-input");
  const importBackdrop = document.getElementById("import-backdrop");
  const importBody = document.getElementById("import-body");
  let importRows = null;
  let importIdCounter = 1;

  // A function (not a static array) so relabeling picks up the active
  // language even if the import modal is reopened after a language switch.
  function fieldOptions() {
    return [
      ["ignore", t("field.ignore")],
      ["name", t("field.name")],
      ["table", t("field.table")],
      ["seat", t("field.seat")],
      ["diet", t("field.diet")],
      ["child", t("field.child")],
      ["allergy", t("field.allergy")],
      ["rsvp", t("field.rsvp")],
      ["note", t("field.note")],
    ];
  }

  function guessField(header) {
    const h = (header || "").toLowerCase();
    if (/nombre|invitad|guest|name/.test(h)) return "name";
    if (/mesa|table/.test(h)) return "table";
    if (/silla|asiento|seat/.test(h)) return "seat";
    if (/alerg/.test(h)) return "allergy";
    if (/dieta|alimentari|restricci|diet/.test(h)) return "diet";
    if (/ni[ñn]o|kid|child|edad/.test(h)) return "child";
    if (/rsvp|confirmaci|asistencia/.test(h)) return "rsvp";
    if (/nota|observ|coment|note/.test(h)) return "note";
    return "ignore";
  }

  importBtn.addEventListener("click", () => importFileInput.click());
  importFileInput.addEventListener("change", async () => {
    const file = importFileInput.files && importFileInput.files[0];
    importFileInput.value = "";
    if (!file) return;
    try {
      let rows;
      const lower = file.name.toLowerCase();
      if (lower.endsWith(".csv")) {
        rows = parseCSV(await file.text());
      } else if (lower.endsWith(".xlsx")) {
        if (typeof DecompressionStream === "undefined") {
          toast(t("toast.xlsxUnsupported"));
          return;
        }
        rows = await readXlsx(await file.arrayBuffer());
      } else {
        toast(t("toast.formatUnsupported"));
        return;
      }
      rows = rows.filter((r) => r.some((c) => String(c ?? "").trim() !== ""));
      if (rows.length < 2) { toast(t("toast.noDataRows")); return; }
      openImportMapper(rows, file.name);
    } catch (err) {
      console.error(err);
      toast(t("toast.readFailed"));
    }
  });

  function openImportMapper(rows, filename) {
    importRows = rows;
    const headers = rows[0].map((h, i) => (h && String(h).trim()) || t("import.columnFallback", i + 1));
    const previewRows = rows.slice(1, 4);

    let html = `<p class="import-step">${t("import.stepText", escapeHtml(filename), rows.length - 1)}</p>`;
    html += '<div class="mapping-scroll"><table class="mapping-table"><thead><tr>';
    headers.forEach((h, i) => {
      html +=
        `<th>${escapeHtml(h)}<br><select data-col="${i}">` +
        fieldOptions().map(([val, label]) => `<option value="${val}" ${guessField(h) === val ? "selected" : ""}>${label}</option>`).join("") +
        "</select></th>";
    });
    html += "</tr></thead><tbody>";
    previewRows.forEach((r) => {
      html += "<tr>" + headers.map((_, i) => `<td class="preview-cell">${escapeHtml(r[i] != null ? String(r[i]) : "")}</td>`).join("") + "</tr>";
    });
    html += "</tbody></table></div>";
    html +=
      `<div class="import-actions"><button class="import-cancel-btn" type="button" id="import-cancel">${t("import.cancel")}</button>` +
      `<button class="import-primary-btn" type="button" id="import-confirm">${t("import.confirm")}</button></div>`;

    importBody.innerHTML = html;
    importBackdrop.classList.add("show");
    document.getElementById("import-cancel").addEventListener("click", closeImportModal);
    document.getElementById("import-confirm").addEventListener("click", commitImport);
  }

  function closeImportModal() {
    importBackdrop.classList.remove("show");
    importRows = null;
  }
  document.getElementById("import-close").addEventListener("click", closeImportModal);
  importBackdrop.addEventListener("click", (e) => {
    if (e.target === importBackdrop) closeImportModal();
  });

  function mapDietText(text) {
    const t = (text || "").toString().trim().toLowerCase();
    if (!t || /ningun|no aplica|^no$/.test(t)) return "none";
    if (t.includes("vegan")) return "vegan";
    if (t.includes("vegetarian")) return "vegetarian";
    if (t.includes("gluten")) return "gluten_free";
    return "other";
  }
  function isTruthyChild(text) {
    const t = (text || "").toString().trim().toLowerCase();
    return ["si", "sí", "s", "y", "yes", "x", "true", "1"].includes(t);
  }
  function mapRsvpText(text) {
    const t = (text || "").toString().trim().toLowerCase();
    if (/declin|no asist|cancel|no\b/.test(t)) return "declined";
    if (/pendient|sin confirmar|pending|no respond/.test(t)) return "pending";
    if (/confirm|s[ií]\b|yes|attending/.test(t)) return "confirmed";
    return "confirmed"; // sheets with no RSVP column at all default to confirmed
  }

  function commitImport() {
    const mapping = {};
    importBody.querySelectorAll("select[data-col]").forEach((sel) => {
      if (sel.value !== "ignore") mapping[sel.value] = parseInt(sel.dataset.col, 10);
    });
    if (mapping.name === undefined) {
      toast(t("toast.selectNameColumn"));
      return;
    }

    const newGuests = [];
    const seatTaken = (tableId, seatNumber) =>
      guests.some((g) => g.tableId === tableId && g.seatNumber === seatNumber) ||
      newGuests.some((g) => g.tableId === tableId && g.seatNumber === seatNumber);

    let seated = 0;
    for (const row of importRows.slice(1)) {
      const name = (row[mapping.name] || "").toString().trim();
      if (!name) continue;

      const guest = {
        id: `imp-${Date.now()}-${importIdCounter++}`,
        name,
        tableId: null,
        seatNumber: null,
        diet: mapping.diet !== undefined ? mapDietText(row[mapping.diet]) : "none",
        child: mapping.child !== undefined ? isTruthyChild(row[mapping.child]) : false,
        allergySevere: mapping.allergy !== undefined ? isTruthyChild(row[mapping.allergy]) : false,
        rsvp: mapping.rsvp !== undefined ? mapRsvpText(row[mapping.rsvp]) : "confirmed",
        note: mapping.note !== undefined ? (row[mapping.note] || "").toString().trim() : "",
      };

      // Auto-seat only when the sheet names a real table, that table has a
      // free seat, AND RSVP is confirmed (unconfirmed guests import fine,
      // they just stay unassigned until their RSVP is settled).
      if (mapping.table !== undefined && guest.rsvp === "confirmed") {
        const tableRaw = (row[mapping.table] || "").toString().trim().toLowerCase();
        const table = tableRaw
          ? tables.find((t) => t.label.toLowerCase().includes(tableRaw) || t.id.replace("t", "") === tableRaw)
          : null;
        if (table) {
          const seats = getChairPositions(table).map((s) => s.seatNumber);
          let seatNumber = null;
          if (mapping.seat !== undefined) {
            const raw = parseInt(row[mapping.seat], 10);
            if (!Number.isNaN(raw) && seats.includes(raw - 1) && !seatTaken(table.id, raw - 1)) seatNumber = raw - 1;
          }
          if (seatNumber === null) seatNumber = seats.find((n) => !seatTaken(table.id, n)) ?? null;
          if (seatNumber !== null) {
            guest.tableId = table.id;
            guest.seatNumber = seatNumber;
            seated++;
          }
        }
      }

      newGuests.push(guest);
    }

    if (!newGuests.length) {
      toast(t("toast.importNoValid"));
      return;
    }

    guests.push(...newGuests);
    closeImportModal();
    renderTables();
    renderGuests();
    toast(t("toast.importSummary", newGuests.length, seated));
  }

  // ---------------------------------------------------------------
  // Print exports: a kitchen sheet (per-table diets/allergies, for
  // catering) and place cards (one per seated guest). Both build into a
  // hidden container and hand off to the browser's own print/PDF dialog —
  // no PDF library needed, and it works entirely offline.
  // ---------------------------------------------------------------
  function escapeHtml2(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function printBrandHeader() {
    return brandLogo ? `<img src="${brandLogo}" class="kp-brand-logo" alt="Logo">` : "";
  }

  function populateKitchenPrint() {
    const container = document.getElementById("kitchen-print");
    const dietCounts = { none: 0, vegan: 0, vegetarian: 0, gluten_free: 0, other: 0 };
    let html = printBrandHeader() + `<h1>${t("print.kitchenTitle")}</h1>`;
    html += `<div class="kp-meta">${t("print.generated", new Date().toLocaleDateString(lang === "en" ? "en-US" : "es-ES", { day: "numeric", month: "long", year: "numeric" }), tables.length)}</div>`;

    for (const table of tables) {
      const seated = guests
        .filter((g) => g.tableId === table.id)
        .sort((a, b) => a.seatNumber - b.seatNumber);
      if (!seated.length) continue;
      html += `<div class="kp-table"><h2>${escapeHtml2(table.label)} — ${t("print.diners", seated.length)}</h2><table>`;
      for (const g of seated) {
        dietCounts[g.diet] = (dietCounts[g.diet] || 0) + 1;
        const dietText = g.diet !== "none" ? escapeHtml2(dietLabel(g.diet)) : t("print.noRestriction");
        const allergy = g.allergySevere ? ` <span class="kp-allergy">${t("print.severeAllergy")}</span>` : "";
        html += `<tr><td>${escapeHtml2(g.name)}</td><td>${dietText}${allergy}</td><td>${g.note ? escapeHtml2(g.note) : ""}</td></tr>`;
      }
      html += `</table></div>`;
    }

    const unseated = guests.filter((g) => !g.tableId && g.rsvp === "confirmed");
    html += `<div class="kp-summary"><strong>${t("print.menuSummary")}</strong> `;
    html += Object.entries(dietCounts).filter(([, n]) => n > 0).map(([k, n]) => `${dietLabel(k) || t("print.noRestriction")}: ${n}`).join(" · ");
    html += `<br>${t("print.stillUnseated", unseated.length)}</div>`;

    container.innerHTML = html;
  }

  function populateCardsPrint() {
    const container = document.getElementById("cards-print");
    const seated = guests.filter((g) => g.tableId).sort((a, b) => a.name.localeCompare(b.name, "es"));
    let html = printBrandHeader() + `<div class="cp-grid">`;
    for (const g of seated) {
      const table = tables.find((t) => t.id === g.tableId);
      html += `<div class="cp-card"><div class="cp-name">${escapeHtml2(g.name)}</div><div class="cp-table">${escapeHtml2(table ? table.label : "")}</div></div>`;
    }
    html += `</div>`;
    container.innerHTML = seated.length
      ? html
      : `<p style="text-align:center;color:#888;">${t("print.noneSeatedYet")}</p>`;
  }

  document.getElementById("export-kitchen-btn").addEventListener("click", () => {
    populateKitchenPrint();
    document.body.dataset.print = "kitchen";
    window.print();
  });
  document.getElementById("export-cards-btn").addEventListener("click", () => {
    populateCardsPrint();
    document.body.dataset.print = "cards";
    window.print();
  });
  window.addEventListener("afterprint", () => { delete document.body.dataset.print; });

  // ---------------------------------------------------------------
  // Branding: drag & drop (or click) a company logo onto the header.
  // Once set, it replaces the default title in the UI and at the top of
  // both print exports — a white-label wedding-planner org would see
  // their own mark everywhere instead of "Plano de Mesas".
  // ---------------------------------------------------------------
  let brandLogo = null;
  const brandZone = document.getElementById("brand-zone");
  const brandTitle = document.getElementById("brand-title");
  const brandLogoImg = document.getElementById("brand-logo");
  const brandRemoveBtn = document.getElementById("brand-remove");
  const brandLogoInput = document.getElementById("brand-logo-input");

  function applyBranding() {
    if (brandLogo) {
      brandTitle.style.display = "none";
      brandLogoImg.style.display = "block";
      brandLogoImg.src = brandLogo;
      brandRemoveBtn.classList.add("has-logo");
    } else {
      brandTitle.style.display = "block";
      brandLogoImg.style.display = "none";
      brandRemoveBtn.classList.remove("has-logo");
    }
  }

  async function setBrandLogoFromFile(file) {
    if (!file || !/^image\/(png|jpeg)$/.test(file.type)) {
      toast("Sube un logo en PNG o JPG.");
      return;
    }
    try {
      brandLogo = await compressImageFile(file, 240, 0.9);
      applyBranding();
      toast(t("toast.logoUpdated"));
    } catch (err) {
      console.error(err);
      toast("No se pudo procesar el logo.");
    }
  }

  brandZone.addEventListener("click", (e) => {
    if (e.target === brandRemoveBtn) return;
    brandLogoInput.click();
  });
  brandLogoInput.addEventListener("change", () => {
    setBrandLogoFromFile(brandLogoInput.files && brandLogoInput.files[0]);
    brandLogoInput.value = "";
  });
  brandZone.addEventListener("dragover", (e) => { e.preventDefault(); brandZone.classList.add("dragover"); });
  brandZone.addEventListener("dragleave", () => brandZone.classList.remove("dragover"));
  brandZone.addEventListener("drop", (e) => {
    e.preventDefault();
    brandZone.classList.remove("dragover");
    setBrandLogoFromFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  brandRemoveBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    brandLogo = null;
    applyBranding();
    toast(t("toast.logoRemoved"));
  });

  // ---------------------------------------------------------------
  // Scope info: what this static, backend-less prototype can and can't do.
  // ---------------------------------------------------------------
  const scopeBackdrop = document.getElementById("scope-backdrop");
  document.getElementById("scope-info-btn").addEventListener("click", () => scopeBackdrop.classList.add("show"));
  document.getElementById("scope-close").addEventListener("click", () => scopeBackdrop.classList.remove("show"));
  scopeBackdrop.addEventListener("click", (e) => { if (e.target === scopeBackdrop) scopeBackdrop.classList.remove("show"); });

  // ---------------------------------------------------------------
  // Language switch — re-applies static translations and re-renders the
  // dynamic bits (diet/RSVP chips, seat tooltips) that read t() live.
  // ---------------------------------------------------------------
  const langSelect = document.getElementById("lang-select");
  langSelect.value = lang;
  langSelect.addEventListener("change", (e) => {
    lang = e.target.value;
    tables.forEach((table) => { if (table.nameKey) table.label = t(table.nameKey); });
    applyI18n();
    renderTables();
    renderGuests();
  });

  applyI18n();
  renderTables();
  renderGuests();
})();
</script>
